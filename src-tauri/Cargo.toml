[package]
name = "blueprint-proocessor"
version = "0.1.0"
description = "A modular data-processor whose processes are defined as visual blueprints"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "blueprint_proocessor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
base64 = "0.22"
# AI provider layer. Pinned exactly: rig-core is pre-1.0 and its API has
# churned between minor releases (0.42 → 0.46 rewrote CompletionRequest).
# `rig-core` (not `rig`) keeps agents/vector stores out of the tree.
rig-core = { version = "=0.46.0", features = ["reqwest"] }
futures = "0.3"
tokio = { version = "1", features = ["time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
